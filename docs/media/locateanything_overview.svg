<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
<title id="title">LocateAnything inside the TurtleBot3 navigation stack</title>
<desc id="desc">Adapted from Yiyuchen Hu's course system overview. This diagram shows the default depth-camera demo. The robot explores and builds a map with LiDAR. LocateAnything outputs labelled 2D boxes from camera images. Camera depth locates the objects, and memory keeps their IDs, pictures, and map positions. A command asks the robot to go to X. LocateAnything matches the description to saved pictures, or memory rules look up an ID and class. The selected object's saved box and depth give its map position. The robot finds a clear spot nearby, drives there with Nav2, and waits for the next command.</desc>
