<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
<title id="title">LocateAnything inside the TurtleBot3 navigation stack</title>
<desc id="desc">Adapted from Yiyuchen Hu's course system overview. Shared autonomous exploration supplies camera views. LocateAnything inventories objects; aligned depth and transforms supply geometry; repeated viewpoints confirm visual memory. Commands use LocateAnything on galleries or scene images, or direct memory rules for IDs and supported bare-class relations. Selected source evidence is localized, checked for a safe approach, and sent to Nav2. The demo waits after success or failure and reuses memory for the next command.</desc>
